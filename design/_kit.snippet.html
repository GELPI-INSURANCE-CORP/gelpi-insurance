<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #1b2a4a; background: #f5f6f8; -webkit-font-smoothing: antialiased; }
    a { color: #1f4fa3; text-decoration: none; } a:hover { color: #163b7f; }
    * { box-sizing: border-box; }
    .nav-parent { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; font-size: 14px; font-weight: 600; color: #ffffff; background: #1f4fa3; }
    .nav-parent svg { width: 16px; height: 16px; stroke: #ffffff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .nav-parent .chev { margin-left: auto; width: 14px; height: 14px; stroke: rgba(255,255,255,0.75); }
    .nav-sub { display: flex; flex-direction: column; gap: 2px; margin: 6px 0 0 20px; padding-left: 12px; border-left: 1px solid #e2e5eb; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; font-size: 13px; color: #4b5563; }
    .nav-item.active { background: #eef3fb; color: #1c3f8a; font-weight: 500; }
    .nav-item.active::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: #1f4fa3; flex-shrink: 0; }
    .card { background: #ffffff; border: 1px solid #e2e5eb; border-radius: 12px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #e2e5eb; }
    .card-title { font-size: 15px; font-weight: 600; color: #1b2a4a; margin: 0; }
    .kpi { background: #ffffff; border: 1px solid #e2e5eb; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 4px; }
    .kpi-label { font-size: 13px; color: #6b7280; }
    .kpi-value { font-size: 26px; font-weight: 600; color: #1b2a4a; letter-spacing: -0.01em; }
    .kpi-sub { font-size: 12px; font-weight: 500; margin-top: 8px; }
    .kpi-sub.ok { color: #059669; } .kpi-sub.warn { color: #b45309; } .kpi-sub.bad { color: #dc2626; } .kpi-sub.muted { color: #6b7280; } .kpi-sub.brand { color: #1f4fa3; }
    table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.tbl th { text-align: left; font-weight: 500; color: #6b7280; padding: 10px 20px; border-bottom: 1px solid #e2e5eb; white-space: nowrap; background: #fafbfc; }
    table.tbl td { padding: 12px 20px; border-bottom: 1px solid #e2e5eb; vertical-align: middle; color: #1b2a4a; }
    table.tbl tr:last-child td { border-bottom: 0; }
    table.tbl td.strong { font-weight: 500; }
    table.tbl td.muted { color: #6b7280; }
    table.tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
    table.tbl th.num { text-align: right; }
    table.tbl tr.selected td { background: #eef3fb; }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08); }
    .badge.ok { background: #ecfdf5; color: #047857; }
    .badge.warn { background: #fffbeb; color: #b45309; }
    .badge.bad { background: #fef2f2; color: #b91c1c; }
    .badge.info { background: #eff6ff; color: #1d4ed8; }
    .badge.neutral { background: #f1f5f9; color: #475569; }
    .badge.brand { background: #eef3fb; color: #1c3f8a; }
    .badge.silver { background: #eceef1; color: #4b5563; }
    .badge svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 8px; font-size: 13px; font-weight: 500; border: 1px solid transparent; white-space: nowrap; }
    .btn.primary { background: #1f4fa3; color: #ffffff; }
    .btn.dark { background: #163b7f; color: #ffffff; }
    .btn.secondary { background: #ffffff; color: #1b2a4a; border-color: #e2e5eb; }
    .btn.ghost { background: transparent; color: #6b7280; }
    .btn.sm { height: 30px; padding: 0 10px; font-size: 12px; }
    .btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid #e2e5eb; background: #ffffff; font-size: 13px; color: #1b2a4a; }
    .chip.active { background: #1f4fa3; color: #ffffff; border-color: #1f4fa3; }
    .chip svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid #e2e5eb; padding: 0 20px; }
    .tab { padding: 12px 4px; margin-right: 20px; font-size: 13px; font-weight: 500; color: #6b7280; border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 8px; }
    .tab.active { color: #1c3f8a; border-bottom-color: #1f4fa3; }
    .count { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: #f1f5f9; color: #475569; font-size: 11px; font-weight: 600; }
    .count.bad { background: #fef2f2; color: #b91c1c; } .count.warn { background: #fffbeb; color: #b45309; } .count.info { background: #eff6ff; color: #1d4ed8; } .count.brand { background: #eef3fb; color: #1c3f8a; }
    .input { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #e2e5eb; background: #ffffff; font-size: 13px; color: #6b7280; }
    .input svg { width: 14px; height: 14px; stroke: #6b7280; fill: none; stroke-width: 2; }
    .avatar { width: 32px; height: 32px; border-radius: 999px; background: #1f4fa3; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
    .avatar.soft { background: #eef3fb; color: #1c3f8a; }
    .avatar.silver { background: #e6e8ec; color: #4b5563; }
    .label { font-size: 12px; color: #6b7280; }
    .value { font-size: 14px; font-weight: 500; color: #1b2a4a; }
    .ai-note { display: flex; gap: 10px; padding: 12px 14px; border-radius: 10px; background: #eef3fb; border: 1px solid #c9d8f2; font-size: 13px; color: #1c3f8a; line-height: 1.45; }
    .ai-note svg { width: 16px; height: 16px; stroke: #1f4fa3; fill: none; stroke-width: 2; flex-shrink: 0; margin-top: 1px; }
    .progress { height: 6px; border-radius: 999px; background: #e6e8ec; overflow: hidden; }
    .progress > div { height: 100%; background: #1f4fa3; border-radius: 999px; }
    .divider { height: 1px; background: #e2e5eb; }
  </style>
</helmet>

<!-- ROOT FRAME 1440x900 -->

          <linearGradient id="gShieldSilver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2e4e8"></stop><stop offset="1" stop-color="#9ca0a8"></stop></linearGradient>

    <nav style="display: flex; flex-direction: column; gap: 4px; padding: 16px 12px; flex-grow: 1;">

    <div style="padding: 16px 20px; border-top: 1px solid #e2e5eb; font-size: 11px; color: #9a9ea6;">Gelpi Insurance © 2026</div>
  </aside>

  <!-- MAIN COLUMN -->
  <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0;">

    <!-- TOPBAR -->
    <header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; background: #ffffff; border-bottom: 1px solid #e2e5eb;">
      <h1 style="font-size: 18px; font-weight: 600; margin: 0; color: #1b2a4a;">TÍTULO DE LA PANTALLA</h1>
      <div style="display: flex; align-items: center; gap: 16px;">
        <div class="input" style="width: 280px;"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>Buscar cliente, póliza o agente…</div>
        <div style="position: relative; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;">
          <svg viewBox="0 0 24 24" style="width: 20px; height: 20px; stroke: #6b7280; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          <span style="position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 999px; background: #1f4fa3;"></span>

        <div class="avatar">JG</div>

    <!-- CONTENT -->
    <main style="flex-grow: 1; padding: 32px; display: flex; flex-direction: column; gap: 24px; overflow: hidden;">

</div>
</x-dc>
