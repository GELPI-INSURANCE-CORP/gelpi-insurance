<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Gelpi Insurance</title>
    <script>
      // GitHub Pages sirve este 404.html para cualquier ruta no pre-renderizada
      // del export estático. Reescribimos la URL para que caiga dentro del
      // basePath /gelpi-insurance/ y dejamos que el router del cliente la resuelva.
      (function () {
        var basePath = "/gelpi-insurance";
        var path = window.location.pathname;

        if (path.indexOf(basePath) !== 0) {
          var suffix = path.replace(/^\//, "");
          var target =
            basePath +
            "/" +
            suffix +
            window.location.search +
            window.location.hash;
          window.location.replace(target);
        } else {
          // Ya está dentro del basePath (ej. ruta desconocida real):
          // mandamos a la raíz de la app.
          window.location.replace(basePath + "/");
        }
      })();
    </script>
  </head>
  <body></body>
</html>
